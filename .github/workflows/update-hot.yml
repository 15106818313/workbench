name: 更新热榜数据

on:
  schedule:
    # 北京时间 10:00 / 15:00 / 18:00 / 22:00  (UTC+8)
    # GitHub Actions cron 使用 UTC: 02:00 / 07:00 / 10:00 / 14:00
    - cron: '0 2,7,10,14 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动点击运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取并生成热榜
        run: python3 scripts/update_hot.py

      - name: 提交并推送
        run: |
          git config user.name "hotbot"
          git config user.email "hotbot@users.noreply.github.com"
          if [ -n "$(git status --porcelain hotdata.json)" ]; then
            git add hotdata.json
            git commit -m "自动更新热榜 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
            echo "已推送更新"
          else
            echo "数据无变化,跳过提交"
          fi
